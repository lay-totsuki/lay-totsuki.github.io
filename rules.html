      <article class="linkCard">

      <article class="linkCard">

        <div class="linkDesc">「好き」「応援してる」という言葉を言うなら、行動（コメント、いいね、拡散、ギフト、切り抜き）で示してください。言葉だけの応援は要らないです。</div>
      </article>
